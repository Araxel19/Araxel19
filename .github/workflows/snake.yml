name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7B2CBF&color_dots=#ebedf0,#E0AAFF,#C77DFF,#9D4EDD,#5A189A
            dist/snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#161b22,#3C096C,#5A189A,#9D4EDD,#E0AAFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
